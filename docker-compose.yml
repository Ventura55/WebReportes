
services:
  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://tareas.quirosingenieria.es:3306/control_produccion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Quiros23
    networks:
      - webnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5002:80"
    depends_on: [backend]
    networks: [webnet]
    restart: unless-stopped

networks:
  webnet:
